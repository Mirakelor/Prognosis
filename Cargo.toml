[package]
name = "prognosis"
version = "0.2.0"
edition = "2024"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
chrono = "0.4"
crossterm = "0.29.0"
encoding_rs = "0.8"
fastrand = "2"
futures = "0.3"
ratatui = "0.30.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
strsim = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "macros", "process", "rt", "test-util", "time"] }
tokio-util = "0.7"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }
